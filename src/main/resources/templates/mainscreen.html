<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Alfonso's Auto Parts Shop - Inventory</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background-color: white; padding: 30px; border-radius: 10px; }
        h1 { color: #007bff; text-align: center; margin-bottom: 30px; }
        .section { margin-bottom: 40px; }
        .btn { padding: 10px 15px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-warning { background-color: #ffc107; color: black; }
        .btn-danger { background-color: #dc3545; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; font-weight: bold; }
        tr:hover { background-color: #f5f5f5; }
        .actions { white-space: nowrap; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Alfonso's Auto Parts Shop - Inventory</h1>
        
        <div class="section">
            <a href="/parts/add" class="btn btn-primary">Add New Part</a>
            <a href="/products/add" class="btn btn-success">Add New Product</a>
            <a href="/about" class="btn btn-primary">About Us</a>
        </div>

        <div class="section">
            <h2>Parts Inventory</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Inventory</th>
                        <th>Min</th>
                        <th>Max</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${parts.empty}">
                        <td colspan="6">No parts available</td>
                    </tr>
                    <tr th:each="part : ${parts}">
                        <td th:text="${part.name}"></td>
                        <td th:text="'$' + ${part.price}"></td>
                        <td th:text="${part.inv}"></td>
                        <td th:text="${part.minInv}"></td>
                        <td th:text="${part.maxInv}"></td>
                        <td class="actions">
                            <a th:href="@{/parts/edit/{id}(id=${part.id})}" class="btn btn-warning">Edit</a>
                            <a th:href="@{/parts/delete/{id}(id=${part.id})}" class="btn btn-danger" 
                               onclick="return confirm('Are you sure you want to delete this part?')">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="section">
            <h2>Products</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Inventory</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${products.empty}">
                        <td colspan="4">No products available</td>
                    </tr>
                    <tr th:each="product : ${products}">
                        <td th:text="${product.name}"></td>
                        <td th:text="'$' + ${product.price}"></td>
                        <td th:text="${product.inv}"></td>
                        <td class="actions">
                            <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-warning">Edit</a>
                            <a th:href="@{/products/delete/{id}(id=${product.id})}" class="btn btn-danger" 
                               onclick="return confirm('Are you sure you want to delete this product?')">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
