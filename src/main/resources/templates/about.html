<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>About - Alfonso's Auto Parts Shop</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background-color: white; padding: 30px; border-radius: 10px; }
        h1 { color: #007bff; text-align: center; }
        .btn { padding: 10px 20px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 th:text="${shopName}">Alfonso's Auto Parts Shop</h1>
        <p th:text="${description}">Shop description</p>
        <p><strong>Mission:</strong> <span th:text="${mission}">Mission statement</span></p>
        <a href="/mainscreen" class="btn"> Back to Inventory</a>
    </div>
</body>
</html>
