<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Product - Alfonso's Auto Parts Shop</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f5f5f5; }
        .container { max-width: 900px; margin: 0 auto; background-color: white; padding: 30px; border-radius: 10px; }
        h1 { color: #007bff; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 10px 20px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-danger { background-color: #dc3545; color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .btn:hover { opacity: 0.8; }
        .error { color: red; margin-top: 5px; }
        .alert { padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .parts-section { display: flex; gap: 20px; margin: 20px 0; }
        .parts-table-container { flex: 1; }
        .parts-table-container h3 { color: #333; margin-bottom: 10px; font-size: 16px; }
        .parts-table { width: 100%; border: 1px solid #ddd; border-radius: 5px; max-height: 250px; overflow-y: auto; }
        .parts-table table { width: 100%; border-collapse: collapse; }
        .parts-table th { background-color: #f8f9fa; padding: 10px; text-align: left; border-bottom: 2px solid #ddd; position: sticky; top: 0; }
        .parts-table td { padding: 10px; border-bottom: 1px solid #eee; }
        .parts-table tr:hover { background-color: #f5f5f5; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .empty-message { padding: 20px; text-align: center; color: #666; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Add New Product</h1>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/products/add}" th:object="${product}" method="post" id="productForm">
            <div class="form-group">
                <label for="name">Product Name:</label>
                <input type="text" id="name" th:field="*{name}" required>
                <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="form-group">
                <label for="price">Price:</label>
                <input type="number" id="price" th:field="*{price}" step="0.01" min="0.01" required>
                <div class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>

            <div class="form-group">
                <label for="inv">Current Inventory:</label>
                <input type="number" id="inv" th:field="*{inv}" min="0" required>
                <div class="error" th:if="${#fields.hasErrors('inv')}" th:errors="*{inv}"></div>
            </div>

            <div class="form-group">
                <label>Manage Product Parts:</label>
                <div class="parts-section">
                    <!-- Available Parts Table -->
                    <div class="parts-table-container">
                        <h3>Available Parts</h3>
                        <div class="parts-table">
                            <table id="availablePartsTable">
                                <thead>
                                    <tr>
                                        <th>Part Name</th>
                                        <th>Price</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="availablePartsList">
                                    <tr th:each="part : ${allParts}"
                                        th:attr="data-part-id=${part.id}, data-part-name=${part.name}, data-part-price=${part.price}">
                                        <td th:text="${part.name}"></td>
                                        <td th:text="'$' + ${part.price}"></td>
                                        <td><button type="button" class="btn btn-success btn-sm" onclick="addPart(this)">Add</button></td>
                                    </tr>
                                </tbody>
                            </table>
                            <div class="empty-message" id="availableEmpty" style="display: none;">No parts available</div>
                        </div>
                    </div>

                    <!-- Associated Parts Table -->
                    <div class="parts-table-container">
                        <h3>Associated Parts</h3>
                        <div class="parts-table">
                            <table id="associatedPartsTable">
                                <thead>
                                    <tr>
                                        <th>Part Name</th>
                                        <th>Price</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="associatedPartsList">
                                    <!-- Parts will be added here dynamically -->
                                </tbody>
                            </table>
                            <div class="empty-message" id="associatedEmpty">No associated parts</div>
                        </div>
                    </div>
                </div>
                <small style="color: #666; display: block; margin-top: 10px;">
                    Use the Add and Remove buttons to manage which parts are included in this product.
                </small>
            </div>

            <!-- Hidden input to store associated part IDs -->
            <input type="hidden" name="partIds" id="partIdsInput" />

            <div>
                <button type="submit" class="btn btn-primary">Add Product</button>
                <a href="/mainscreen" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>

    <script>
        function addPart(button) {
            const row = button.closest('tr');
            const partId = row.getAttribute('data-part-id');
            const partName = row.getAttribute('data-part-name');
            const partPrice = row.getAttribute('data-part-price');

            // Remove from available table
            row.remove();

            // Add to associated table
            const associatedList = document.getElementById('associatedPartsList');
            const newRow = document.createElement('tr');
            newRow.setAttribute('data-part-id', partId);
            newRow.setAttribute('data-part-name', partName);
            newRow.setAttribute('data-part-price', partPrice);
            newRow.innerHTML = `
                <td>${partName}</td>
                <td>$${partPrice}</td>
                <td><button type="button" class="btn btn-danger btn-sm" onclick="removePart(this)">Remove</button></td>
            `;
            associatedList.appendChild(newRow);

            updateEmptyMessages();
            updateHiddenInput();
        }

        function removePart(button) {
            const row = button.closest('tr');
            const partId = row.getAttribute('data-part-id');
            const partName = row.getAttribute('data-part-name');
            const partPrice = row.getAttribute('data-part-price');

            // Remove from associated table
            row.remove();

            // Add back to available table
            const availableList = document.getElementById('availablePartsList');
            const newRow = document.createElement('tr');
            newRow.setAttribute('data-part-id', partId);
            newRow.setAttribute('data-part-name', partName);
            newRow.setAttribute('data-part-price', partPrice);
            newRow.innerHTML = `
                <td>${partName}</td>
                <td>$${partPrice}</td>
                <td><button type="button" class="btn btn-success btn-sm" onclick="addPart(this)">Add</button></td>
            `;
            availableList.appendChild(newRow);

            updateEmptyMessages();
            updateHiddenInput();
        }

        function updateEmptyMessages() {
            const availableCount = document.getElementById('availablePartsList').children.length;
            const associatedCount = document.getElementById('associatedPartsList').children.length;

            document.getElementById('availableEmpty').style.display = availableCount === 0 ? 'block' : 'none';
            document.getElementById('availablePartsTable').style.display = availableCount === 0 ? 'none' : 'block';

            document.getElementById('associatedEmpty').style.display = associatedCount === 0 ? 'block' : 'none';
            document.getElementById('associatedPartsTable').style.display = associatedCount === 0 ? 'none' : 'block';
        }

        function updateHiddenInput() {
            const associatedRows = document.querySelectorAll('#associatedPartsList tr');
            const partIds = Array.from(associatedRows).map(row => row.getAttribute('data-part-id'));
            document.getElementById('partIdsInput').value = partIds.join(',');
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            updateEmptyMessages();
            updateHiddenInput();

            // Form validation before submit
            document.getElementById('productForm').addEventListener('submit', function(e) {
                const associatedCount = document.getElementById('associatedPartsList').children.length;
                if (associatedCount === 0) {
                    e.preventDefault();
                    alert('Not enough Associated Parts! A product must have at least one part.');
                    return false;
                }
            });
        });
    </script>
</body>
</html>
