<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Product - Alfonso's Auto Parts Shop</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background-color: white; padding: 30px; border-radius: 10px; }
        h1 { color: #007bff; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 10px 20px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .error { color: red; margin-top: 5px; }
        .parts-list { max-height: 200px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; border-radius: 5px; background-color: #f9f9f9; }
        .parts-list label { font-weight: normal; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; }
        .parts-list input[type="checkbox"] { width: auto; margin-right: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Add New Product</h1>
        
        <form th:action="@{/products/add}" th:object="${product}" method="post">
            <div class="form-group">
                <label for="name">Product Name:</label>
                <input type="text" id="name" th:field="*{name}" required>
                <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            
            <div class="form-group">
                <label for="price">Price:</label>
                <input type="number" id="price" th:field="*{price}" step="0.01" min="0.01" required>
                <div class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>
            
            <div class="form-group">
                <label for="inv">Current Inventory:</label>
                <input type="number" id="inv" th:field="*{inv}" min="0" required>
                <div class="error" th:if="${#fields.hasErrors('inv')}" th:errors="*{inv}"></div>
            </div>

            <div class="form-group">
                <label>Available Parts:</label>
                <div class="parts-list">
                    <div th:if="${allParts.empty}">
                        <p style="color: #666; font-style: italic;">No parts available</p>
                    </div>
                    <div th:each="part : ${allParts}">
                        <label>
                            <input type="checkbox"
                                   name="partIds"
                                   th:value="${part.id}" />
                            <span th:text="${part.name} + ' - $' + ${part.price}"></span>
                        </label>
                    </div>
                </div>
                <small style="color: #666; display: block; margin-top: 5px;">
                    Select the parts that are included in this product
                </small>
            </div>

            <div>
                <button type="submit" class="btn btn-primary">Add Product</button>
                <a href="/mainscreen" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
